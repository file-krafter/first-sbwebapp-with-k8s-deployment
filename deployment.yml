apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-k8s-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: springboot-k8s-app
  template:
    metadata:
      labels:
        app: springboot-k8s-app
    spec:
      containers:
        - name: springboot-container
          image: filekrafter95/springboot-k8s-demo:1.0
          ports:
            - containerPort: 8080
          imagePullPolicy: Always
